[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twit_check"
version = "0.1.0"
description = "Basic Twitter sentiment scraper + retrieval chatbot"
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "shruti" } ]
license = { text = "MIT" }
keywords = ["twitter", "sentiment", "chatbot"]

[project.optional-dependencies]
dev = ["pytest"]
